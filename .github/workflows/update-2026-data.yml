name: Update 2026 Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Merge 2026 CSV
        run: python scripts/merge_2026_csv.py

      - name: Build 2026 embedding visualization
        run: python scripts/build_cluster_viz.py

      - name: Assign research themes
        run: python scripts/assign_research_themes.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/submissions.json docs/data/submissions.json data/embeddings_2026.json docs/data/embeddings_2026.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update 2026 CCN poster data"
            git push
          fi
