name: Update 2026 Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build.py --merge-2026

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/submissions.json docs/data/submissions.json data/abstracts.csv docs/data/abstracts.csv data/embeddings_all.json docs/data/embeddings_all.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update 2026 CCN poster data"
            git push
          fi
