name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scrape:
        description: "Scrape CCN archives before deploy"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && inputs.scrape
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.scrape
        run: pip install requests beautifulsoup4 lxml pypdf numpy scikit-learn umap-learn

      - name: Scrape CCN archives
        if: github.event_name == 'workflow_dispatch' && inputs.scrape
        run: |
          python scripts/scrape.py --merge-2026
          python scripts/build.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
