name: Scrape CCN Data

# Full archive rebuild (2017–2026). For 2026-only updates, use "Update 2026 Data" instead.

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years to scrape (comma-separated, e.g. 2024,2025). Leave empty for all."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape CCN archives
        run: |
          if [ -n "${{ inputs.years }}" ]; then
            YEAR_ARGS="${{ inputs.years }}"
            YEAR_ARGS="${YEAR_ARGS//,/ }"
            python scripts/scrape.py --years $YEAR_ARGS
          else
            python scripts/scrape.py
          fi

      - name: Build dashboard data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/submissions.json data/abstracts.csv docs/data/abstracts.csv data/embeddings_all.json data/google_topics.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update CCN submission data [manual scrape]"
            git push
          fi
